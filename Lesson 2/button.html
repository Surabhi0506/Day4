<!DOCTYPE html>
<html>
    <head>
<style>
    .subscriber-button
    {
        background-color:rgb(55, 55, 165);
        color:rgb(255,255,255);
        border:none;
        height:36px;
        width:105px;
        border-radius:2px;
        cursor:pointer;
        margin-right:8px;    
    }

    .join-button
    {
        bg-color:red;
        border-color:rgb(41,56,78);
        border-style:none;
        border-width:1px;
        color:rgb(41,118,211);
        height:36px;
        width:105px;
        border-radius:2px;
        cursor:pointer;
    }

    .tweet-button
    {
        bg-color:blue;
        border-color:white;
        border-style:none;
        border-width:1px;
        color:white;
        height:36px;
        width:105px;
        border-radius:2px;
        cursor:pointer;
    }
</style>
</head>
<body>
<button class="subscriber-button">SUBSCRIBE</button>
<button class="join-button">JOIN</button>
<button class="tweet-button">TWEET</button>
</body>
</html>
