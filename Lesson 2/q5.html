<!DOCTYPE html>
<html>
    <head>
        <title>q5 CSS</title>
        <style>
            .button1
            {
                background-color:rgb(10,102,194);
                color:white;
                font-size:15px;
                font-weight:bold;
                border-style:none;
                border-radius:25px;
                padding-top:12px;
                padding-right:12px;
                padding-left:12px;
                padding-bottom:12px;
                margin-right:10px;
            }

            {
                background-color:white;
                color:rgb(10,102,194);
                font-size:20px;
                font-weight:bold;
                border-style:solid;
                border-width:2px;
                border-color:rgb(10,102,194);
                border-radius:25px;
                padding-top:10px;
                padding-right:25px;
                padding-left:25px;
                padding-bottom:10px;
            }
        </style>
    </head>
    <body>
        <button class="button1">Apply on company website</button>
        <button class="button2">Save</button>
    </body>
    </html>
