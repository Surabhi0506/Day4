<!DOCTYPE html>
<html>
    <head>
        <title>q4 css</title>
        <style>
            .button1
            {
                background-color:rgb(121,82,179);
                color:white;
                font-size:20px;
                font-weight:bold;
                border-radius:15px;
                border-style:none;
                padding-top:15px;
                padding-right:15px;
                padding-left:15px;
                padding-bottom:15px;
                margin-right:10px;
            }

            .button2
            {
                background-color:white;
                color:rgb(108,117,125);
                font-size:20px;
                font-weight:bold;
                border-style:solid;
                border-width:2px;
                border-color:rgb(108,117,125);
                border-radius:3px;
                padding-top:10px;
                padding-right:10px;
                padding-left:10px;
                padding-bottom:10px;
            }
        </style>
    </head>
    <body>
        <button class="button1">Get Started</button>
        <button class="button2">Download</button>
    </body>
</html>
