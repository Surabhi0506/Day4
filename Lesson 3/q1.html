<!DOCTYPE html>
<html>
    <head>
        <title>q1 CSS</title>
        <style>
            .uber-button {
                background-color: black;
                color: white;
                border: none;
                height: 40px;
                width: 110px;
                cursor: pointer;
                transition: opacity 0.15s;
             }

            .uber-button:hover {
                opacity: 0.8;
            }
        </style>
    </head>
    <body>
        <button class="uber-button">Request now</button>
    </body>
</html>
